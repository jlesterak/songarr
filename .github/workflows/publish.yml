name: publish

# Publishes the container image to ghcr.io/<owner>/songarr.
#
# RELEASES ONLY. The image is built when a version tag (v1.2.3) is pushed, and
# never on an ordinary commit to main. This workflow used to chain off a green
# `tests` run on main, which meant every merged change silently became the
# :latest that `docker compose pull` hands to users -- there was no way to
# commit work in progress without shipping it.
#
# Tags produced for v1.2.3:
#   ghcr.io/<owner>/songarr:1.2.3       immutable -- pin this in production
#   ghcr.io/<owner>/songarr:latest      moves to the newest release
#   ghcr.io/<owner>/songarr:sha-abc1234 traceable back to the exact commit
#
# A manual workflow_dispatch builds only the sha- tag, so an ad-hoc run can
# never move :latest out from under anyone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never let two publishes race for the same tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag push does not wait for the `tests` workflow, so the suite runs here
  # too. A release is the one place a broken build must not get through.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # A healthy build takes ~3 min; arm64 under QEMU has hung for hours (v0.2.9).
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"   # GHCR rejects uppercase in the image path

          sha=$(git rev-parse --short HEAD)

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Guard against a tag that disagrees with the version in the code:
            # the image would claim a version the app does not report.
            git_version="${GITHUB_REF_NAME#v}"
            file_version=$(node -p "require('./package.json').version")
            if [ "$git_version" != "$file_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${file_version} in package.json"
              exit 1
            fi
            tags="${image}:${git_version}"$'\n'"${image}:latest"$'\n'"${image}:sha-${sha}"
          else
            # Manual run: traceable, but it must not become anyone's :latest.
            tags="${image}:sha-${sha}"
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing:"; echo "${tags}"

      # arm64 (Raspberry Pi) is built under emulation; scripts/build-local.sh
      # --arm64 smoke-tested it on 2026-10-19.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Reuse layers between runs so ffmpeg and node_modules aren't rebuilt each time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Published \`${{ steps.tags.outputs.image }}\`"
            echo ""
            echo "From commit \`${{ github.sha }}\` (${{ github.ref_name }})."
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
